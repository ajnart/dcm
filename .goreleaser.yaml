version: 2

project_name: self-host

# The release workflow validates vX.Y.Z (or new-cli-vX.Y.Z) and supplies X.Y.Z.
# Package locally with --snapshot; publication is owned by that workflow.
snapshot:
  version_template: "{{ .Env.SELF_HOST_RELEASE_VERSION }}"

builds:
  - id: self-host
    main: ./cmd/self-host
    binary: self-host
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: self-host
    formats: [tar.gz]
    name_template: "self-host_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true
