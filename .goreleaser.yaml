version: 2

project_name: self-host

# The release workflow validates vX.Y.Z (or new-cli-vX.Y.Z) and supplies X.Y.Z.
# Package locally with --snapshot; publication is owned by that workflow.
snapshot:
  version_template: "{{ .Env.SELF_HOST_RELEASE_VERSION }}"

builds:
  - id: self-host
    main: ./cmd/self-host
    binary: self-host
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
      - -X github.com/ajnart/self-host/internal/telemetry.ProjectKey={{ envOrDefault "POSTHOG_PROJECT_KEY" "phc_zY6Yg8ePwEfXC8FadEqkCcoCgzzy2u2VHjpaPTooBDfg" }}

archives:
  - id: self-host
    formats: [tar.gz]
    name_template: "self-host_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

# goreleaser only writes the AUR PKGBUILD into dist/aur/; scripts/publish-aur.sh
# pushes it once the vX.Y.Z release is public.
aurs:
  - name: self-host-bin
    ids: [self-host]
    homepage: https://self-host.fyi
    description: Install and operate self-hosted apps with Docker Compose from one Go binary
    license: Apache-2.0
    maintainers:
      - "Thomas <thomas at ajnart dot fr>"
    git_url: ssh://aur@aur.archlinux.org/self-host-bin.git
    url_template: "https://github.com/ajnart/self-host/releases/download/v{{ .Version }}/{{ .ArtifactName }}"
    skip_upload: true
    provides: [self-host]
    conflicts: [self-host]
    depends: []
    optdepends:
      - "docker: runs the Apps"
      - "docker-compose: Compose v2 plugin the Apps run on"
    package: |-
      install -Dm755 "./self-host" "${pkgdir}/usr/bin/self-host"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/self-host-bin/LICENSE"
