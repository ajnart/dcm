name: e2e

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      targets:
        description: Space separated Recipe or App ids; all covers both inventories
        required: false
        default: "ntfy vaultwarden media"

permissions:
  contents: read

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Test
        env:
          E2E_TARGETS: ${{ github.event.inputs.targets || 'ntfy vaultwarden media' }}
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
        run: go test -tags e2e -v -timeout 90m ./e2e/
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-recipes
          path: |
            ${{ runner.temp }}/e2e-logs/inventory.json
            ${{ runner.temp }}/e2e-logs/app-*.json
            ${{ runner.temp }}/e2e-logs/recipe-*.json
            !${{ runner.temp }}/e2e-logs/private/**
          if-no-files-found: ignore

  catalog:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Test
        env:
          E2E_TARGETS: all
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
        run: go test -tags e2e -v -timeout 340m ./e2e/
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-catalog
          path: |
            ${{ runner.temp }}/e2e-logs/inventory.json
            ${{ runner.temp }}/e2e-logs/app-*.json
            ${{ runner.temp }}/e2e-logs/recipe-*.json
            !${{ runner.temp }}/e2e-logs/private/**
          if-no-files-found: ignore
