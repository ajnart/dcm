name: dcm-image

on:
  push:
    branches: [main]
    tags: ["dcm-v*"]
    paths:
      - "dcm/**"
      - "site/**"
      - "tools/sitegen/**"
      - "docs/telemetry.md"
      - "video/reel/assets/agents/**"
      - "LICENSE"
      - "package.json"
      - "turbo.json"
      - "bun.lock"
      - ".github/workflows/dcm-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dcm-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ajnart/dcm

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - name: Latest CLI release
        run: echo "SELF_HOST_SITE_VERSION=$(bun -e 'import { latestVersion } from "./site/src/lib/version.ts"; console.log(await latestVersion())')" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Test and build the site
        run: bunx turbo run test test:compose build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELF_HOST_SITE_COMMIT: ${{ github.sha }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=dcm-v(.*),group=1
            type=match,pattern=dcm-v(\d+\.\d+),group=1
            type=match,pattern=dcm-v(\d+),group=1
            type=sha
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only AND Apache-2.0
            org.opencontainers.image.source=https://github.com/ajnart/self-host
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dcm/Dockerfile
          build-contexts: site=site/dist
          build-args: REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
