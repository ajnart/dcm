name: release

on:
  push:
    tags: ["v*", "new-cli-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate CLI channel and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$GITHUB_REPOSITORY" == ajnart/selfhost-skills || "$GITHUB_REPOSITORY" == ajnart/selfhost ]]
          [[ "$RELEASE_TAG" =~ ^(new-cli-)?v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=${RELEASE_TAG#new-cli-}
          printf 'SELF_HOST_RELEASE_VERSION=%s\n' "${version#v}" >> "$GITHUB_ENV"
      - name: Check installer and self-update fixtures
        run: |
          bash -n install.sh
          go test ./internal/release ./internal/cli -run '^(TestLatest|TestAuthenticated|TestUpdate|TestNewer|TestDevBuild|TestMalformedVersions|TestExtract|TestInstall|TestRepository|TestAnInvalid|TestSelfUpdate)'
      # OSS snapshot packaging never publishes from goreleaser itself.
      # The validated tag (vX.Y.Z or new-cli-vX.Y.Z) supplies the version; gh owns publication.
      - uses: goreleaser/goreleaser-action@v6
        env:
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Verify exact archive set and native Linux binary
        run: |
          version=$SELF_HOST_RELEASE_VERSION
          expected=$(printf 'self-host_%s_linux_amd64.tar.gz\nself-host_%s_linux_arm64.tar.gz\nself-host_%s_darwin_amd64.tar.gz\nself-host_%s_darwin_arm64.tar.gz\n' "$version" "$version" "$version" "$version" | sort)
          actual=$(find dist -maxdepth 1 -name 'self-host_*.tar.gz' -printf '%f\n' | sort)
          test "$expected" = "$actual"
          (cd dist && sha256sum --check checksums.txt)
          mkdir -p "$RUNNER_TEMP/release-check"
          tar -xzf "dist/self-host_${version}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/release-check" self-host
          test "$("$RUNNER_TEMP/release-check/self-host" --version)" = "$version"
          "$RUNNER_TEMP/release-check/self-host" apps list --json >/dev/null
          "$RUNNER_TEMP/release-check/self-host" skill >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: self-host-${{ github.ref_name }}
          path: |
            dist/self-host_*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
      - name: Publish and verify immutable CLI assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$SELF_HOST_RELEASE_VERSION
          assets=("dist/self-host_${version}_linux_amd64.tar.gz" "dist/self-host_${version}_linux_arm64.tar.gz" "dist/self-host_${version}_darwin_amd64.tar.gz" "dist/self-host_${version}_darwin_arm64.tar.gz" dist/checksums.txt)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --title "self-host $version" --notes "Linux and macOS amd64/arm64 CLI. WSL2 uses Linux binaries; native WSL validation is pending. Native Windows is unsupported."
          fi
          mkdir -p "$RUNNER_TEMP/release-download"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-download"
          for asset in "${assets[@]}"; do
            cmp "$asset" "$RUNNER_TEMP/release-download/${asset##*/}"
          done
          (cd "$RUNNER_TEMP/release-download" && sha256sum --check checksums.txt)
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
