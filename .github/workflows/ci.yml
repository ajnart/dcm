name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build and vet
        run: go build ./... && go vet ./... && go vet -tags e2e ./e2e/
      - name: Generated data is current
        run: |
          go run ./tools/sitegen
          git add -N site/src/data dcm/src/data site/src/styles
          git diff --exit-code site/src/data dcm/src/data site/src/styles
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./internal/tui/ ./internal/activity/
      - name: Installer syntax
        run: bash -n install.sh

  web:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SELF_HOST_SITE_VERSION: "0.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - name: Build, test, lint and check
        run: bunx turbo run build test test:compose lint check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  native-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Native ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    env:
      SMOKE_VERSION: "0.0.44"
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Build and execute native binary
        shell: bash
        run: |
          test "$(go env GOHOSTOS)" = "$TARGET_OS"
          test "$(go env GOHOSTARCH)" = "$TARGET_ARCH"
          smoke_root="$RUNNER_TEMP/native-smoke"
          mkdir -p "$smoke_root"
          go build -trimpath -ldflags="-s -w -X main.version=$SMOKE_VERSION" -o "$smoke_root/self-host" ./cmd/self-host
          export SELF_HOST_HOME="$smoke_root/project"
          test "$("$smoke_root/self-host" --version)" = "$SMOKE_VERSION"
          "$smoke_root/self-host" --help > "$smoke_root/help.txt"
          "$smoke_root/self-host" apps list --json > "$smoke_root/apps.json"
          "$smoke_root/self-host" skill > "$smoke_root/skill.md"
          uname -s > "$smoke_root/host-os.txt"
          uname -m > "$smoke_root/host-arch.txt"
          tar -czf "$smoke_root/self-host_${SMOKE_VERSION}_${TARGET_OS}_${TARGET_ARCH}.tar.gz" -C "$smoke_root" self-host
      - name: Install local checksummed archive and reject corruption
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import http.server
          import json
          import os
          import pathlib
          import subprocess
          import threading

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-smoke"
          version = os.environ["SMOKE_VERSION"]
          tag = "v" + version
          archive_name = "self-host_{}_{}_{}.tar.gz".format(version, os.environ["TARGET_OS"], os.environ["TARGET_ARCH"])
          archive = (root / archive_name).read_bytes()
          checksum = hashlib.sha256(archive).hexdigest()
          corrupt = False

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/api/releases/tags/" + tag:
                      body = json.dumps({"tag_name": tag, "draft": False, "prerelease": False, "assets": [{"id": 1, "name": "checksums.txt"}, {"id": 2, "name": archive_name}]}).encode()
                  elif self.path == "/web/releases/download/" + tag + "/checksums.txt":
                      body = (checksum + "  " + archive_name + "\n").encode()
                  elif self.path == "/web/releases/download/" + tag + "/" + archive_name:
                      body = archive
                      if corrupt:
                          body = archive + b"corrupt"
                  else:
                      self.send_error(404)
                      return
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass

          server = http.server.HTTPServer(("127.0.0.1", 0), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          base = "http://127.0.0.1:" + str(server.server_port)
          env = dict(os.environ)
          env.pop("SELF_HOST_GITHUB_TOKEN", None)
          env.update({"SELF_HOST_VERSION": version, "SELF_HOST_INSTALL_DIR": str(root / "installed"), "SELF_HOST_RELEASES_URL": base + "/api", "SELF_HOST_WEB_URL": base + "/web", "SELF_HOST_HOME": str(root / "project")})
          try:
              result = subprocess.run(["bash", "install.sh"], env=env, capture_output=True, text=True, timeout=60, check=True)
              (root / "install.txt").write_text(result.stdout + result.stderr)
              installed = root / "installed" / "self-host"
              assert subprocess.check_output([str(installed), "--version"], env=env, text=True).strip() == version
              original = installed.read_bytes()
              corrupt = True
              result = subprocess.run(["bash", "install.sh"], env=env, capture_output=True, text=True, timeout=60)
              assert result.returncode != 0 and "checksum mismatch" in result.stderr, result.stdout + result.stderr
              assert installed.read_bytes() == original, "corruption replaced existing binary"
              (root / "checksum.txt").write_text(checksum + "  " + archive_name + "\n")
              assert json.loads((root / "apps.json").read_text())
          finally:
              server.shutdown()
              server.server_close()
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-smoke-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-smoke
          if-no-files-found: error
