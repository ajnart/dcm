name: ${COMPOSE_PROJECT_NAME}

services:
  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "022"
    volumes:
      - ${SESSION_ROOT}/config/prowlarr:/config
    ports:
      - "${MEDIA_PORT_BIND_PREFIX:-}${PROWLARR_PORT:-9696}:9696"
    restart: unless-stopped

  radarr:
    image: ghcr.io/hotio/radarr:latest
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "022"
    volumes:
      - ${SESSION_ROOT}/config/radarr:/config
      - ${SESSION_ROOT}/data:/data
    ports:
      - "${MEDIA_PORT_BIND_PREFIX:-}${RADARR_PORT:-7878}:7878"
    restart: unless-stopped

  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "022"
    volumes:
      - ${SESSION_ROOT}/config/sonarr:/config
      - ${SESSION_ROOT}/data:/data
    ports:
      - "${MEDIA_PORT_BIND_PREFIX:-}${SONARR_PORT:-8989}:8989"
    restart: unless-stopped

  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:latest
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "022"
      WEBUI_PORT: ${QBITTORRENT_PORT:-8080}
      WEBUI_PORTS: ${QBITTORRENT_PORT:-8080}/tcp
    volumes:
      - ${SESSION_ROOT}/config/qbittorrent:/config
      - ${SESSION_ROOT}/data/torrents:/data/torrents
    ports:
      - "${MEDIA_PORT_BIND_PREFIX:-}${QBITTORRENT_PORT:-8080}:${QBITTORRENT_PORT:-8080}"
    restart: unless-stopped

  jellyfin:
    image: ghcr.io/hotio/jellyfin:latest
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "022"
    volumes:
      - ${SESSION_ROOT}/config/jellyfin:/config
      - ${SESSION_ROOT}/data/media:/data/media
    ports:
      - "${MEDIA_PORT_BIND_PREFIX:-}${JELLYFIN_PORT:-8096}:8096"
    networks:
      - default
      - web
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    environment:
      TZ: ${TZ}
      API_KEY: ${SEERR_API_KEY}
    volumes:
      - ${SESSION_ROOT}/config/seerr:/app/config
    ports:
      - "${MEDIA_PORT_BIND_PREFIX:-}${SEERR_PORT:-5055}:5055"
    networks:
      - default
      - web
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  homarr:
    image: ghcr.io/homarr-labs/homarr:dev
    pull_policy: always
    environment:
      TZ: ${TZ}
      SECRET_ENCRYPTION_KEY: ${HOMARR_ENCRYPTION_KEY}
    volumes:
      - ${SESSION_ROOT}/config/homarr:/appdata
    ports:
      - "${MEDIA_PORT_BIND_PREFIX:-}${HOMARR_PORT:-7575}:7575"
    networks:
      - default
      - web
    restart: unless-stopped

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_network
  web:
    name: ${COMPOSE_PROJECT_NAME}_web
    internal: true
