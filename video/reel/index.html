<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>self-host — showreel</title>
<link rel="stylesheet" href="node_modules/@fontsource-variable/inter-tight/index.css">
<link rel="stylesheet" href="node_modules/@fontsource-variable/jetbrains-mono/index.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="saas/saas.css">
</head>
<body>
<div id="stage">

  <!-- bars 0-2 · hook, the rented wall, "Your servers." -->
  <section class="scene" id="hook"><div class="cam" id="hook-cam">
    <div id="tiles"></div>
    <h1 id="hook-t"><span class="ln"><span class="mk"><span class="w">Stop renting</span></span></span><span class="ln"><span class="mk"><span class="w">your <b>software.</b></span></span></span></h1>
    <div id="wallhead"><span class="mk"><span id="wh-a" class="w">Their servers.</span></span><span class="mk"><span id="wh-b" class="w">Your servers.</span></span></div>
    <div id="meter"><div class="m-n" id="m-n" data-deco>$0</div><div class="m-ls"><div class="m-l" id="m-l1">per month, rented</div><div class="m-l" id="m-l2">per month, yours</div></div></div>
  </div></section>

  <!-- bars 3-4 · the drop, the install command, the Compose Project -->
  <section class="scene" id="product"><div class="cam" id="product-cam">
    <div id="dia"></div>
    <div id="lockup"><div id="mark"><svg viewBox="0 0 100 100"><path d="M50 2 98 50 50 98 2 50Z"/></svg></div><div id="wm"></div></div>
    <div id="cmd"><span class="pr">$</span> <span id="cmd-l1"></span><span id="cmd-l2"></span><span class="caret" id="cmd-c"></span></div>
    <div id="out"><div class="o" id="o1"><span class="okc">✓</span> <b>6 Apps</b><span class="arw">→</span>Catalog</div><div class="o" id="o2"><span class="okc">✓</span> <b>homarr</b><span class="arw">→</span>Dashboard</div></div>
    <div id="proj"><div id="proj-box"></div><div class="p-label" id="p-label">compose project <span class="dim">·</span> homelab</div><div id="proj-row"></div></div>
  </div></section>

  <!-- bars 5-6 · TUI: Setup -->
  <section class="scene" id="setup"><div class="cam" id="setup-drift">
    <div id="setup-cam"><div id="win" data-deco></div></div>
    <div class="hbar"><div class="hcap" id="cap-setup"><span class="mk"><span class="w">Sets up every App.</span></span></div></div>
  </div></section>

  <!-- bars 7-8 · Links -->
  <section class="scene" id="links"><div class="cam" id="links-cam">
    <div id="lk-grid"></div>
    <div class="hbar"><div class="hcap" id="cap-links"><span class="mk"><span class="w">Links them together.</span></span></div><div class="hcount" id="lk-count" data-deco></div></div>
  </div></section>

  <!-- bars 8-9 · Homarr board -->
  <section class="scene" id="boardsc"><div class="cam" id="board-drift">
    <div id="board-cam"><div id="board" data-deco></div></div>
    <div class="hbar"><div class="hcap" id="cap-board"><span class="mk"><span class="w">Builds your dashboard.</span></span></div></div>
  </div></section>

  <!-- bars 9-10 · pivot -->
  <section class="scene" id="pivot"><div class="cam" id="pivot-cam">
    <div id="flags" data-deco></div>
    <h2 id="pivot-t"><span class="ln"><span class="mk"><span class="w">Don’t want to learn</span></span></span><span class="ln"><span class="mk"><span class="w">the <span class="cli">CLI</span>?</span></span></span></h2>
  </div></section>

  <!-- bars 11-13 · the skill in six agents -->
  <section class="scene" id="agents"><div class="cam" id="agents-cam">
    <div id="ag-strip"></div>
    <div id="ag-left"></div>
    <div id="chat"></div>
    <div id="cursor"><svg viewBox="0 0 24 24"><path d="M4 3 20 11.5l-7 2-3.5 6.5Z"/></svg></div>
  </div></section>

  <!-- bar 14 · the flurry -->
  <section class="scene" id="flurry">
    <div id="fl-bg"></div>
    <div id="fl-words"></div>
  </section>

  <!-- bars 15-16 · end card -->
  <section class="scene" id="endsc"><div class="cam" id="end-cam">
    <div id="end"></div>
  </div></section>

  <!-- "Replace the SaaS you pay for" cut (?cut=saas): the hook, the ask and the swaps; its flurry and end card are the sections above -->
  <section class="scene" id="shook"><div class="cam" id="shook-cam">
    <div id="sh-tiles" data-deco></div>
    <h1 id="sh-t"><span class="ln"><span class="mk"><span class="w">Replace the SaaS</span></span></span><span class="ln"><span class="mk"><span class="w">you <b>pay for.</b></span></span></span></h1>
  </div></section>

  <section class="scene" id="sk"><div class="cam" id="sk-cam">
    <div id="sk-strip"></div>
    <div id="sk-chat" class="chatw"></div>
    <div id="sk-cursor"><svg viewBox="0 0 24 24"><path d="M4 3 20 11.5l-7 2-3.5 6.5Z"/></svg></div>
  </div></section>

  <section class="scene" id="sw"><div class="cam" id="sw-cam"><div id="sw-wipe"></div><div id="sw-clip">
    <div id="sw-blocks"></div>
    <div id="dash"></div>
  </div></div></section>

</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
