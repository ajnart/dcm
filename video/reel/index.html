<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>self-host — showreel</title>
<link rel="stylesheet" href="node_modules/@fontsource-variable/inter-tight/index.css">
<link rel="stylesheet" href="node_modules/@fontsource-variable/unbounded/index.css">
<link rel="stylesheet" href="node_modules/@fontsource-variable/jetbrains-mono/index.css">
<link rel="stylesheet" href="node_modules/@fontsource/instrument-serif/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/instrument-serif/400-italic.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">

  <!-- 1 · hook + the rented wall -->
  <section class="scene" id="s1">
    <div class="glow" id="s1-glow"></div>
    <div id="tiles"></div>
    <h1 id="hook"><span class="ln"><span class="mk"><span class="w">Stop</span></span> <span class="mk"><span class="w strike" id="w-renting">renting</span></span></span><span class="ln"><span class="mk"><span class="w">your</span></span> <span class="mk"><span class="w">own</span></span> <span class="mk"><em class="w">stuff.</em></span></span></h1>
    <div id="wallhead"><span class="mk"><span id="wh-a" class="w">Their servers.</span></span><span class="mk"><span id="wh-b" class="w">Yours.</span></span></div>
    <div id="meter"><div class="m-n" id="m-n">$0</div><div class="m-l">per month, rented</div></div>
  </section>

  <!-- 2 · product -->
  <section class="scene" id="s3">
    <div class="bgfill" id="s3-bg"></div>
    <div id="dia"></div>
    <div id="wm">self-host</div>
    <div id="mark"><svg viewBox="0 0 100 100"><path d="M50 4 96 50 50 96 4 50Z"/></svg></div>
    <div id="s3-cap"><div class="mk"><div id="cap-a" class="w">One command.</div></div><div class="mk"><div id="cap-b" class="w">A whole <em>stack.</em></div></div></div>
    <div id="cmd"><span class="pr">$</span> <span id="cmd-t"></span><span class="caret" id="cmd-c"></span></div>
    <div id="proj"><div class="p-label"><span class="pl-d">◆</span> ~/.self-host <i>·</i> one Compose Project</div><div id="p-icons"></div></div>
  </section>

  <!-- 3 · pre-boot -->
  <section class="scene" id="s4">
    <canvas id="stars" width="1920" height="1080"></canvas>
    <div id="pb-dia"><svg viewBox="0 0 100 100"><path d="M50 4 96 50 50 96 4 50Z"/></svg></div>
    <div id="pb-quote"><span class="mk"><span class="w">About as long as a song on the radio.</span></span></div>
    <div id="pb-icons"></div>
    <div id="pb-bar"><div class="pb-top"><span id="pb-spin">⠋</span> <b>Pulling images</b><span class="pb-n" id="pb-n">0 of 6 images</span></div><div class="pb-track"><div id="pb-fill"></div></div></div>
  </section>

  <!-- 4 · TUI -->
  <section class="scene" id="s5">
    <div class="bgfill" id="s5-bg"></div>
    <div id="s5-cam"><div id="win"></div><div id="board"></div></div>
    <div id="s5-heads"></div>
  </section>

  <!-- 5 · pivot -->
  <section class="scene" id="s6">
    <div class="bgfill" id="s6-bg"></div>
    <div id="flags"></div>
    <h2 id="pivot"><span class="ln"><span class="mk"><span class="w">Don’t</span></span> <span class="mk"><span class="w">want</span></span> <span class="mk"><span class="w">to</span></span> <span class="mk"><span class="w">learn</span></span></span><span class="ln"><span class="mk"><span class="w">the</span></span> <span class="mk"><span class="w cli">CLI</span></span><span class="mk"><span class="w q">?</span></span></span></h2>
  </section>

  <!-- 6 · skill + agent chat -->
  <section class="scene" id="s7">
    <div class="bgfill" id="s7-bg"></div>
    <div id="sk-left"></div>
    <div id="chat"></div>
    <div id="cursor"><svg viewBox="0 0 24 24"><path d="M3 2 21 11l-8 2.2L9.6 21Z"/></svg></div>
  </section>

  <!-- 7 · end card -->
  <section class="scene" id="s8">
    <div class="bgfill" id="s8-bg"></div>
    <canvas id="mosaic" width="1920" height="1080"></canvas>
    <div id="end"></div>
  </section>

  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="flash"></div>
  <div id="vig"></div>
  <div id="grain"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="node_modules/gsap/dist/CustomEase.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
